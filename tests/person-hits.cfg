# =====================================================================================
#  Concrete Jungle - person-hit scenes (CJ-035), run on the empty test road:
#      ConcreteJungle.exe --shot build/shots/cj035/hits.png --scenario person-hits --frames 1000000 --uncapped
#  (another file: --test <file>; one scene or class: CJ_TEST_CASE=<part of the run name>)
#  See docs/testing.md#person-hit-scenes. Not shipped in the release.
#
#  Positions are metres from the centre of the test road, x east and y south; headings
#  and facings are degrees clockwise from north.
#
#  SCENE <name> <max s>
#     Starts a scene. It ends half a second after everything has settled (people at rest,
#     up again or dead; vehicles stopped or past everyone), or after <max s>.
#  SEED <positive 32-bit integer>
#     Optional fixed seed for that scene, in decimal or 0x hexadecimal. Without it the
#     original fixture seed plus the run index is used.
#  LOOK <1-based civilian look index>
#     Optional look for every civilian, in the order of CIVILIAN in civilians.cfg.
#  MOTION <initial aware-person speed m/s>
#     Aware people start moving at this speed along their facing (default 0 m/s).
#  TRAITS <attentive|distracted|headphones> <scan s> <horizon s> <reaction s|look> <mobility|look> <freeze s>
#     Pins the aware people's traits; 'look' retains the chosen look's sampled reaction
#     or its mobility. The initial sampled reaction is also logged when later pinned.
#     The attention profile still supplies its viewing angle and hearing from behind.
#  VEHICLE <class|all> <km/h> <brake|keep> <x> <y> <heading>
#     The vehicle's front is at x, y. It drives at <km/h> until it first touches someone,
#     then brakes fully ('brake') or holds the speed ('keep'). 'all' runs the scene once
#     for every vehicle class of vehicles.cfg; a class whose top speed is lower is skipped.
#  PERSON <kind> <x> <y> <facing> [<count> <dx> <dy>]
#     kind: standing (does not see it coming), aware (sees it and reacts), lying (alive
#     on the ground), dead, player (stands still). With <count>, a row of people, each
#     <dx>, <dy> m from the one before.
#  CROWD <count> <x> <y> <radius> [kind]
#     <count> people (aware unless a kind is given) at random points of a disc.
#  CHECK <name>       applies a check to every person of the scene:
#     bump      touched, on their feet, unhurt, no contact later than 1 s after the first
#     falls     on the ground at some time
#     throw     the throw distance within Searle's corridor for the launch speed and, but
#               for two-wheelers, Happer's band for the impact speed (cars, or light trucks
#               for a front edge at 1 m or higher)
#     momentum  the vehicle's momentum loss within 10 % of the person's gain
#     runover   dead, moved at most 0.3 m, the vehicle lost at most 2 km/h and got past
#     body      moved at most 0.3 m, the vehicle lost at most 1 km/h and got past
#     getup     fell, and up again 2.5-3.5 s after coming to rest from a fall (a speed
#               change under 25 km/h) or 4-5 s after a throw, or died
#  CHECK evasion-accel <max m/s^2>
#     Actual per-frame velocity change while an aware person dodges, before any impact,
#     at most this ceiling times their mobility. At least one person must actually move
#     in Dodge, so a scene in which nobody reacts cannot pass the acceleration check.
#  CHECK evasion-speed <max m/s>
#     Actual unhit Dodge speed, at most this ceiling times mobility; also needs at least
#     one person physically moving in Dodge. For a running entry, allow inherited speed.
#  CHECK reaction-time <min s> <max s>
#     The time between first registering a vehicle alarm and first starting Dodge.
#  CHECK freeze-time <min s> <max s>
#     The time an unhit person spends in Dodge with a positive freeze timer.
#  CHECK frozen-speed <max m/s>
#     The highest actual unhit speed while the freeze timer is positive; pair this with
#     freeze-time so a scene without any freeze cannot establish stillness.
#  CHECK look-mobility <expected multiplier>
#     The actual mobility of an aware person must equal this value.
#  CHECK reaction-ratio <earlier scene name> <min multiplier> <max multiplier>
#     Initial personal reaction divided by the same-index person's initial reaction in
#     the earlier scene. Use the same seed/placements to compare adult and older looks.
#     The reference must have run first; filter both scenes together with CJ_TEST_CASE.
#  CHECK inherited-slowdown <time after Dodge s> <min speed reduction m/s>
#     From the measured speed entering the first Dodge to the speed at this later time.
#     It fails if that observation never occurs before an impact. Pair with evasion-speed
#     at the initial speed to check that a faster inherited run slows without speeding up.
#  CHECK persistent-traits
#     Every frame, including after impacts, an aware person's attention, scan period,
#     notice horizon, reaction, mobility and freeze delay must equal their initial values
#     after fixture overrides. The check requires zero frames with a changed trait.
#  Every scene also checks that a contact lasts at most 0.1 s, a vehicle carries nobody
#  more than 0.3 m, and no living person stays more than 3 px inside a vehicle for more
#  than 2 frames; and that nobody who fell is drawn lying while still in the air, and a body
#  sliding more than 1 m along the road turns at least 20 degrees per metre (tumbling).
#  EXPECT <metric> <min share> <max share>, both 0..1
#     metric: hit|fell|dead|escaped|threatened-escaped|noticed|dodged|
#             noticed-before-hit|dodged-before-hit|frozen
#     The share of the scene's people hit, fallen, dead or not hit, in a range.
#     threatened-escaped counts only people initially in a vehicle's straight swept
#     body (its width plus the person's radius, out to its speed times the scene limit).
#     noticed/dodged count the people who registered a vehicle alarm / started Dodge.
#     The before-hit variants exclude reactions after an impact; frozen counts people
#     observed freezing at least one unhit frame.
#  CAPTURE <name> <s>
#     Saves <shot>_<run>-<name>.png at that time of the scene.
#  INJURY <class> <from km/h> <to km/h> <step> <draws>
#     Not a scene: the share of draws of the injury function that kill, per impact speed,
#     within 3 percentage points of Tefft's death curve.
# =====================================================================================

# ---- 1, 2: a bump, a fall ----
SCENE bump-2kmh 6
VEHICLE all 2 brake 0 1 0
PERSON standing 0 0 90
CHECK bump

SCENE bump-2kmh-player 6
VEHICLE all 2 brake 0 1 0
PERSON player 0 0 90
CHECK bump

SCENE fall-10kmh 8
VEHICLE all 10 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK momentum

SCENE fall-10kmh-player 9
VEHICLE all 10 brake 0 1 0
PERSON player 0 0 90
CHECK falls
CHECK getup

# ---- 3, 4: throws by braking vehicles ----
SCENE throw-15kmh 8
VEHICLE all 15 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CHECK momentum

SCENE throw-25kmh 8
VEHICLE all 25 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CHECK momentum

SCENE throw-40kmh 9
VEHICLE all 40 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CHECK momentum

SCENE throw-60kmh 10
VEHICLE all 60 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CHECK momentum

SCENE throw-100kmh 13
VEHICLE all 100 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CHECK momentum

# ---- 10: the player falls or is thrown, lies and gets up ----
SCENE throw-15kmh-player 10
VEHICLE all 15 brake 0 1 0
PERSON player 0 0 90
CHECK falls
CHECK getup

SCENE throw-50kmh-player 11
VEHICLE all 50 brake 0 1 0
PERSON player 0 0 90
CHECK falls
CHECK getup

# ---- 6, 7: creeping vehicles and vehicles that do not brake ----
SCENE creep-2kmh 8
VEHICLE all 2 keep 0 1 0
PERSON standing 0 0 90

SCENE creep-2kmh-player 8
VEHICLE all 2 keep 0 1 0
PERSON player 0 0 90

SCENE creep-5kmh 8
VEHICLE all 5 keep 0 1 0
PERSON standing 0 0 90

SCENE creep-5kmh-player 8
VEHICLE all 5 keep 0 1 0
PERSON player 0 0 90

SCENE keep-30kmh 8
VEHICLE all 30 keep 0 1 0
PERSON standing 0 0 90

SCENE keep-60kmh 8
VEHICLE all 60 keep 0 1 0
PERSON standing 0 0 90

# ---- 8, 9: driving over people lying on the road ----
SCENE runover-5kmh 12
VEHICLE all 5 keep 0 2 0
PERSON lying 0 0 90
CHECK runover

SCENE runover-30kmh 6
VEHICLE all 30 keep 0 2 0
PERSON lying 0 0 90
CHECK runover

SCENE body-15kmh 7
VEHICLE all 15 keep 0 2 0
PERSON dead 0 0 90
CHECK body

SCENE body-60kmh 5
VEHICLE all 60 keep 0 2 0
PERSON dead 0 0 90
CHECK body

# ---- 12: the player's fall art, for the contact sheet ----
SCENE player-fall-art 10
VEHICLE Taxi 15 brake 0 1 0
PERSON player 0 0 90
CHECK falls
CHECK getup
CAPTURE impact 0.15
CAPTURE falling 0.45
CAPTURE lying 2.0
CAPTURE getting-up 3.6
CAPTURE up 4.2

# ---- a civilian thrown by a braking car, and one flying over a car that keeps on ----
SCENE throw-art 10
VEHICLE Taxi 50 brake 0 1 0
PERSON standing 0 0 90
CHECK falls
CHECK throw
CAPTURE flying 0.35
CAPTURE landed 1.6

SCENE vault-art 10
VEHICLE Taxi 90 keep 0 1 0
PERSON standing 0 0 90
CHECK falls
CAPTURE wrap 0.1
CAPTURE over 0.35
CAPTURE behind 0.8

# ---- 5: the injury function ----
INJURY Taxi 10 100 10 4000
