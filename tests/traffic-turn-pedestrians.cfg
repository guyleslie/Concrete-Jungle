# CJ-038 regression: turning traffic yields to a stationary crossing person before
# any physical contact, then resumes after the person clears. The person has no
# perception or voluntary movement in this fixture, so a dodge cannot hide a miss.
# Coordinates (pixels from the junction centre) normalize the recorded city contacts
# into the runner's northbound approach: BoxTruck / Bruiser left, Taxi right.
# CASE name class turn Hz surface x_px y_px clear_s
CASE truck-left-sidewalk-60 BoxTruck left 60 sidewalk -91.3 -71.7 8
CASE bruiser-left-road-60 Bruiser left 60 road -100.5 -62.4 8
CASE taxi-right-road-60 Taxi right 60 road 68.3 -4.2 8
CASE truck-left-sidewalk-20 BoxTruck left 20 sidewalk -91.3 -71.7 8
CASE bruiser-left-road-20 Bruiser left 20 road -100.5 -62.4 8
CASE taxi-right-road-20 Taxi right 20 road 68.3 -4.2 8
