# =====================================================================================
#  Concrete Jungle - pedestrian evasion scenes (CJ-038).
#      ConcreteJungle.exe --shot build/shots/cj038/evasion.png --scenario person-hits --test tests/person-evasion.cfg --frames 1000000 --uncapped
#  The format is documented in tests/person-hits.cfg. The game runs its own physics,
#  contacts and pedestrian AI, with a fixed 1/60 s clock on an empty road.
#
#  Rows measure front-facing and rear-facing people; the crowds include safe bystanders,
#  so use threatened-escaped to keep those out of the escape denominator. Long-warning
#  cases begin outside the old 1.6 s prediction window. Short-warning cases begin close;
#  later people in each row have more warning. Individual results log actual notice,
#  Dodge start, reaction duration and the largest unhit Dodge velocity change per second.
#  Fixed seeds keep each scene independent of its position in this file.
#
#  CHECK evasion-accel 6 is the proposed upper acceleration for an average evasive step
#  (m/s^2), intentionally checked against the old model in the before measurement.
#  Escape shares are measured here; the acceptance range 50-65 % applies to city rampage,
#  whose geometry and warning times differ from these isolated scenes.
# =====================================================================================

SCENE long-front-row-50 10
CHECK persistent-traits
SEED 0xc03801
VEHICLE Taxi 50 keep 0 24 0
PERSON aware 0 0 180 18 0 -2
CHECK evasion-accel 6
EXPECT threatened-escaped 0 1
EXPECT noticed 0 1
EXPECT dodged 0 1
CAPTURE notice 0.3
CAPTURE dodge 1.2

SCENE long-rear-row-50 10
CHECK persistent-traits
SEED 0xc03801
VEHICLE Taxi 50 keep 0 24 0
PERSON aware 0 0 0 18 0 -2
CHECK evasion-accel 6
EXPECT threatened-escaped 0 1
EXPECT noticed 0 1
EXPECT dodged 0 1

SCENE short-front-row-50 10
