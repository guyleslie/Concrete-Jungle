SCENE slow-front-row-10 14
CHECK persistent-traits
SEED 0xc03804
VEHICLE Taxi 10 keep 0 5 0
PERSON aware 0 0 180 10 0 -2
CHECK evasion-accel 6
EXPECT threatened-escaped 0 1
EXPECT noticed 0 1
EXPECT dodged 0 1

# ---- Controlled traits: each acceleration case must actually begin an evasive step ----
SCENE pinned-front-reaction-50 10
CHECK persistent-traits
SEED 0xc03811
LOOK 1
TRAITS attentive 0.1 1.6 0.3 1 0
VEHICLE Taxi 50 keep 0 20 0
PERSON aware 0 0 180
CHECK evasion-accel 6
CHECK reaction-time 0.23 0.36
CHECK evasion-speed 4.6
EXPECT noticed-before-hit 1 1
EXPECT dodged-before-hit 1 1
EXPECT threatened-escaped 1 1
EXPECT frozen 0 0
CAPTURE turning 0.45
CAPTURE stepping 0.75

# Same layout and scan as the attentive case isolate the longer decision delay.
# Both people see the car early enough to escape; a missing delay fails the check.
SCENE pinned-distracted-front-reaction-50 10
CHECK persistent-traits
SEED 0xc03811
LOOK 1
TRAITS distracted 0.1 1.6 0.6 1 0
VEHICLE Taxi 50 keep 0 20 0
PERSON aware 0 0 180
CHECK evasion-accel 6
CHECK reaction-time 0.49 0.72
CHECK evasion-speed 4.6
EXPECT noticed-before-hit 1 1
EXPECT dodged-before-hit 1 1
EXPECT threatened-escaped 1 1
EXPECT frozen 0 0
CAPTURE deciding 0.45
CAPTURE delayed-step 0.9

SCENE pinned-rear-reaction-50 10
CHECK persistent-traits
SEED 0xc03811
LOOK 1
TRAITS attentive 0.1 1.6 0.3 1 0
VEHICLE Taxi 50 keep 0 20 0
PERSON aware 0 0 0
CHECK evasion-accel 6
CHECK reaction-time 0.36 0.54
