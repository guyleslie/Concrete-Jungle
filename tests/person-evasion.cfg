# Paired looks use the same spawn draw. Preserve their data-driven reaction as well as
# mobility: the older look must react 1.25 times as slowly and have .75 mobility.
SCENE pinned-look-adult-front-50 10
CHECK persistent-traits
SEED 0xc03814
LOOK 1
TRAITS attentive 0.1 2.2 look look 0
VEHICLE Taxi 50 keep 0 30 0
PERSON aware 0 0 180
CHECK evasion-accel 6
CHECK look-mobility 1
CHECK evasion-speed 4.6
EXPECT noticed-before-hit 1 1
EXPECT dodged-before-hit 1 1
EXPECT threatened-escaped 1 1
CAPTURE adult-step 0.8

SCENE pinned-look-older-front-50 10
CHECK persistent-traits
SEED 0xc03814
LOOK 9
TRAITS attentive 0.1 2.2 look look 0
VEHICLE Taxi 50 keep 0 30 0
PERSON aware 0 0 180
CHECK evasion-accel 6
CHECK look-mobility 0.75
CHECK evasion-speed 4.6
CHECK reaction-ratio pinned-look-adult-front-50 1.24 1.26
EXPECT noticed-before-hit 1 1
EXPECT dodged-before-hit 1 1
EXPECT threatened-escaped 1 1
CAPTURE older-step 0.8

# Reaction is immediate so the first evasive frame inherits the full 5.5 m/s approach.
# It must retain the acceleration bound, never exceed that inherited speed, and slow
# by at least .1 m/s within .4 s instead of gaining speed while turning sideways.
SCENE pinned-inherited-run-front-50 10
CHECK persistent-traits
SEED 0xc03815
LOOK 1
TRAITS attentive 0.1 2.2 0 1 0
MOTION 5.5
VEHICLE Taxi 50 keep 0 30 0
PERSON aware 0 0 180
CHECK evasion-accel 6
CHECK evasion-speed 5.5
CHECK inherited-slowdown 0.4 0.1
EXPECT noticed-before-hit 1 1
EXPECT dodged-before-hit 1 1
EXPECT threatened-escaped 1 1
CAPTURE entry 0.05
CAPTURE turning-run 0.3
