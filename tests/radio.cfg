# =====================================================================================
#  CJ-040 radio scenes: ./ConcreteJungle.exe --shot build/shots/radio.png --frames 100000 --scenario radio
#  then: python tools/run_cj040.py --analyse  (or run_cj040.py alone to do both)
#  See docs/testing.md#radio-scenes.
#
#  SCHEDULE <hours> <seeds>
#     The programme of every station for that many hours, once per seed, from the clip
#     lengths: never two clips in a row, no song or clip again within its PROGRAMME gap,
#     a clip after 55-75 % of the songs, every clip played.
#
#  PASS <name> <km/h> <side m> <cabin dB> <foot|car>
#     On an empty road a taxi with its radio on the first station at that cabin level
#     (radio.cfg CABIN: 80 normal, 92 loud) drives past the player at the speed (negative:
#     westwards), its path <side> metres from the player (positive: south), from beyond
#     hearing to beyond hearing. The player stands (foot) or sits in a car with its radio
#     off (car). The mix and the station's own signal go to build/radio/<name>*.
#
#  INCAR <name> <clip> <clip after it> <song after that>
#     The player sits in a car tuned to the first station, which joins <clip> 6 s before
#     its end, then plays the other two; the gap between clips must stay within 50 ms.
#
#  EXCERPT <name> <seconds> <fade in s> <fade out s> <songs>
#     The player sits in a car tuned to the first station, whose songs are cut to slices of
#     that length (instead of radio.cfg's EXCERPT) from a random point, with those fades. From
#     the end of a talk clip the programme runs until that many songs have aired: every clip
#     airs its slot within 50 ms, every change within 50 ms of silence, and the radio's
#     update takes at most 5 ms in any frame (the seek into a song happens on a worker).
# =====================================================================================

SCHEDULE 24 10

# normal radios on foot: speeds, a farther path, the other direction
PASS foot-normal-30-2      30   2 80 foot
PASS foot-normal-50-2      50   2 80 foot
PASS foot-normal-80-2      80   2 80 foot
PASS foot-normal-50-4      50   4 80 foot
PASS foot-normal-west-50-2 -50  2 80 foot
# loud radios on foot
PASS foot-loud-30-4        30   4 92 foot
PASS foot-loud-50-4        50   4 92 foot
PASS foot-loud-80-4        80   4 92 foot
PASS foot-loud-50-2        50   2 92 foot
# from inside a car: through two bodies
PASS car-loud-50-2         50   2 92 car
PASS car-loud-50-4         50   4 92 car
PASS car-normal-50-2       50   2 80 car

# the player's own radio across clip changes: every talk clip once
INCAR song-dj01-song  song_01.mp3 dj_01.mp3 song_02.mp3
INCAR song-dj02-song  song_03.mp3 dj_02.mp3 song_04.mp3
INCAR song-dj03-song  song_05.mp3 dj_03.mp3 song_06.mp3
INCAR song-ad01-song  song_07.mp3 ad_01.mp3 song_08.mp3
INCAR song-ad02-song  song_02.mp3 ad_02.mp3 song_01.mp3
INCAR song-ad03-song  song_04.mp3 ad_03.mp3 song_03.mp3

# songs cut to slices as in the game, shorter so that the changes come quickly
EXCERPT excerpt-12 12 2 4 3
