# =====================================================================================
#  Concrete Jungle - vehicles hitting people (CJ-035)
#  Edit this file to tune how vehicles meet people. No code changes needed.
#  The measurements behind the values: docs/backlog.md#cj-035-vehicles-hitting-people.
#
#  A contact is one impact, never a push. The person takes the share mv / (mv + mp) of the
#  closing speed, and the vehicle loses what they gain. Below their balance limit they
#  stagger; past it they are launched, fly, lose the friction of the landing and slide.
#  Vehicles drive over people lying on the road. Every record is required, once.
#
#  PERSON <mass kg> <centre of mass m>
#     A front edge (vehicles.cfg FRONT) below the centre of mass wraps the person onto the
#     vehicle; a higher one throws them forward.
#  BALANCE <min m/s> <max m/s> <stagger s>
#     The speed change a civilian withstands on their feet, drawn for each person between the
#     two values (the player has the mean). Below it they stagger and step out of the way for
#     <stagger s>; another contact meanwhile knocks them down. Balance studies give no single
#     figure, so these are design values.
#  GROUND <friction> <tumble deg per m>
#     A body sliding on the road, and the impulse of its landing (Searle: 0.7 on a dry road);
#     how far a body bouncing and rolling along the road turns per metre, so that it tumbles to
#     rest instead of gliding in one pose.
#  WRAP <launch deg> <impact factor>
#  PROJECTION <launch deg> <impact factor>
#     The launch angle and the share of the speed the body keeps, for a front below the
#     centre of mass and for one at or above it. They put the throw distance inside Happer's
#     band (cars and light trucks) and Searle's corridor at every speed from 15 to 100 km/h.
#  INJURY <km/h> <per km/h>
#     The person's speed change at which half die, and the slope of the logistic curve.
#     Tefft (2011): half the people hit at 68 km/h die. A 1.1 t car wrapping a person changes
#     their speed by 0.88 of its own, so that is 59.5 km/h of change, and his 0.078 per km/h
#     of impact speed is 0.089 per km/h of change; heavier vehicles hurt a little more.
#  DOWN <km/h> <fall min s> <max s> <throw min s> <max s>
#     A speed change below <km/h> is a fall, above it a throw; the time on the ground after
#     coming to rest. The player then gets up in the time of player.cfg GETUP.
#  RUNOVER <shove m> <jolt km/h>
#     A body driven over moves this far at most, and the vehicle loses this much speed.
# =====================================================================================

PERSON      75 1.0
BALANCE     1.0 1.6 0.8
GROUND      0.7 40
WRAP        25 0.94
PROJECTION  10 1.0
INJURY      59.5 0.089
DOWN        25 1.2 2.0 2.7 3.5
RUNOVER     0.2 1.0
