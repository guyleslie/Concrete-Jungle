# =====================================================================================
#  Concrete Jungle - civilians (pedestrian looks)
#  Edit this file to add or remove looks. No code changes needed.
#
#  FRAME <px> <metres>
#     Atlas frame size in pixels, and the metres one frame covers at life size. Standing
#     people are drawn CHAR_SCALE (1.35) times life size; the lying frame is rendered over
#     metres x CHAR_SCALE, so a body on the ground shows at real size.
#
#  SCALE <factor>
#     Standing civilians are drawn this much larger again, so that an average man reads as
#     large as the player, whose combat stance and vest make him broad (1.12: the average
#     man's width within 10 % of the player's, standing and walking). Lying bodies stay real size.
#
#  SWAY <radians>
#     How far the game turns a walking person with the steps. The rendered walk already
#     sways, so 0 here.
#
#  ANIM <animation> <first frame> <frames> [<s>]
#     Where an animation's frames are in every atlas: walk, idle, lying, punch (right, left),
#     fist (two shake positions), jog, run and fall. Jog and run are optional. The fall (CJ-035:
#     thrown back off the feet onto the back) gives the seconds it plays at least; a longer
#     flight stretches it, and it ends in the lying pose. Falling and lying frames are rendered
#     over metres x CHAR_SCALE, like the lying one.
#
#  GAIT <jog|run> <from m/s> <steps/s there> <to m/s> <steps/s there>
#     The gait shows from the first speed up (and holds until 0.3 m/s below it); its cadence
#     rises linearly between the two points. Their feet touch the ground for a frame at most,
#     so they play by cadence; the walk advances with the distance walked instead.
#
#  ATTENTION <attentive|distracted|headphones> <share> <scan s> <notice horizon s>
#            <view degrees> <reaction min s> <max s> <behind factor> <hears behind 0|1>
#     The three profiles are required once and their shares must add up to 1. A person
#     keeps the sampled profile; outside the view cone, only someone who hears behind
#     can notice an approaching vehicle. Crossing gap checks still look in every direction.
#  DODGE <fast m/s> <slow m/s> <acceleration m/s^2> <turn rad/s>
#     Evasive movement, scaled by the look's mobility. Its actual change of velocity,
#     including the turn of the body, cannot exceed acceleration times the frame duration.
#  FREEZE <share> <min s> <max s>
#     The share of people who briefly freeze when a new vehicle threat is noticed. A
#     freezing person slows within the same acceleration limit before taking evasive steps.
#
#  CIVILIAN <file in assets/characters/civilians/> <walk cycle m> <mobility> <reaction factor>
#     One look: a strip of frames, the person facing the top of the image. The walk cycle is
#     the look's stride, measured from its own animation, so that planted feet stay put.
#     Mobility scales walking speed and evasive speed/acceleration; reaction factor scales
#     the sampled reaction time. All four fields are required. Older looks are slower and
#     react later; balance stays the personal value drawn from impacts.cfg.
#
#  The looks are rendered from 3D models by tools/cj004/make_civilians.py, which also writes
#  the walk cycles; see assets/art/cj004/README.md. At least one loadable CIVILIAN line is
#  required; without one, loading fails (docs/adr/0009-required-character-atlases.md).
# =====================================================================================

FRAME 144 2.1
SCALE 1.12
SWAY 0

ANIM walk  0 16
ANIM idle  16 1
ANIM lying 17 1
ANIM punch 18 2
ANIM fist  20 2
ANIM jog   22 8
ANIM run   30 8
ANIM fall  38 8 0.5

GAIT jog 2.0 2.5 4.0 2.8
GAIT run 4.0 2.8 6.5 3.3
ATTENTION attentive  0.70 0.10 1.6 200 0.18 0.45 1.5 1
ATTENTION distracted 0.19 0.35 1.0 200 0.35 0.75 1.5 1
ATTENTION headphones 0.11 0.35 1.0 200 0.35 0.75 1.5 0
DODGE 4.5 1.8 6.0 20
FREEZE 0.08 0.25 0.65

CIVILIAN civilian-01.png 1.37 1.00 1.00
