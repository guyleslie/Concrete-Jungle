# =====================================================================================
#  Concrete Jungle - civilians (pedestrian looks)
#  Edit this file to add or remove looks. No code changes needed.
#
#  FRAME <px> <metres>
#     Atlas frame size in pixels, and the metres one frame covers at life size. Standing
#     people are drawn CHAR_SCALE (1.35) times life size; the lying frame is rendered over
#     metres x CHAR_SCALE, so a body on the ground shows at real size.
#
#  SCALE <factor>
#     Standing civilians are drawn this much larger again, so that an average man reads as
#     large as the player, whose combat stance and vest make him broad (1.12: the average
#     man's width within 10 % of the player's, standing and walking). Lying bodies stay real size.
#
#  WALK <metres>   distance of one 8-frame walk cycle (two steps)
#  RUN <metres>    distance of one 8-frame run cycle, used above 3.6 m/s
#
#  CIVILIAN <file in assets/characters/civilians/>
#     One look: a strip of frames, the person facing the top of the image.
#     0-7 walk, 8 idle, 9 lying, 10 right punch, 11 left punch, 12-13 raised fist,
#     14-21 run (optional; without them the walk frames are used for running).
#     Every atlas needs the same frame size and count.
#
#  The looks are rendered from 3D models by tools/cj004/make_civilians.py; see
#  assets/art/cj004/README.md. Without any loadable CIVILIAN line the game uses 28
#  procedural looks.
# =====================================================================================

FRAME 144 2.1
SCALE 1.12
WALK 1.3
RUN 3.2

