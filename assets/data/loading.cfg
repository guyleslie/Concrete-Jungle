# Loading-screen cosmetics. Work, weights, counters and readiness come from startup
# reporters; this file never creates tasks or supplies percentages.
# Paths are relative to the game working directory. Missing optional images/fonts
# retain the primitive title/status presentation and never fail game startup.
# HEADLINE/LABEL/DETAIL: task ID followed by joined whitespace-separated words.
# HEADLINE is current work; LABEL is one completed group; DETAIL is a generic default.
# Dynamic reporter details and qualified counts take precedence over generic DETAIL.
# TEXT: presentation string key followed by words. '#' starts a comment; no quoting.
# COLOR: key followed by R G B A integers, each 0..255. Invalid entries retain defaults.

BACKGROUND assets/ui/loading-city.png
WORDMARK assets/ui/loading-logo.png
FONT_BOLD assets/fonts/Rajdhani-Bold.ttf
FONT_SEMI assets/fonts/Rajdhani-SemiBold.ttf

COLOR base 16 23 29 255
COLOR primary 240 238 232 255
COLOR secondary 184 194 204 255
COLOR accent 255 205 70 255
COLOR track 53 65 76 255
COLOR fatal 240 142 127 255

TEXT bootstrap Preparing startup...
TEXT bootstrap_detail Optional cosmetic resources
TEXT discovery Finding game content...
TEXT ready Ready
TEXT failed Unable to start the game
TEXT cancelled Closing game...
TEXT exit Press Esc to exit
TEXT recent Recently completed:

HEADLINE assets.materials Loading ground materials...
LABEL assets.materials Ground materials
DETAIL assets.materials Roads, pavements and facades
HEADLINE assets.vehicles Loading vehicle textures...
LABEL assets.vehicles Vehicle textures
DETAIL assets.vehicles Cars, vans and motorbikes
HEADLINE assets.civilians Loading civilian characters...
LABEL assets.civilians Civilian characters
DETAIL assets.civilians People and clothing variants
HEADLINE assets.animations Loading character animations...
LABEL assets.animations Character animations
DETAIL assets.animations Walking, running and actions
HEADLINE assets.foliage Preparing foliage...
LABEL assets.foliage Foliage
DETAIL assets.foliage Trees and bushes
HEADLINE assets.effects Preparing city objects...
LABEL assets.effects City objects and effects
DETAIL assets.effects Street furniture, water and lighting
HEADLINE assets.fonts Preparing the interface...
LABEL assets.fonts Interface fonts
HEADLINE assets.shaders Preparing graphics...
LABEL assets.shaders Graphics shaders
DETAIL assets.shaders Lighting and compositing
HEADLINE traffic.turns Planning traffic turns...
LABEL traffic.turns Traffic routes
DETAIL traffic.turns Vehicle paths through junctions
HEADLINE world.city Building the city...
LABEL world.city City
DETAIL world.city Streets, buildings and metro
HEADLINE world.minimap Preparing the city map...
LABEL world.minimap City map
DETAIL world.minimap Map preview
HEADLINE world.renderer Preparing graphics buffers...
LABEL world.renderer Graphics buffers
HEADLINE world.audio Preparing sounds...
LABEL world.audio Sounds
DETAIL world.audio Effects, engines and sirens
HEADLINE world.population Preparing the city population...
LABEL world.population City population
DETAIL world.population Traffic, pedestrians and player
HEADLINE startup.ready Preparing the title screen...
LABEL startup.ready Startup checks
DETAIL startup.ready Checking required resources
