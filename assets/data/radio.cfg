# =====================================================================================
#  Concrete Jungle - car radio (CJ-040)
#  Stations broadcast live: each plays its programme all the time, and a car tuned to
#  a station plays the broadcast from where it is. Edit this file to add stations or
#  clips; no code changes needed. docs/design/radio.md explains the model.
#
#  Global records, each exactly once:
#
#  INCAR <volume 0-1>
#     Game volume of the player's own radio. It stands for the normal cabin level below,
#     so a radio outside is played at its level relative to that.
#
#  CABIN <normal dB> <loud dB> <loud share 0-1>
#     Music level inside a traffic car with the radio on, and the share played loud.
#
#  BODY <corner Hz> <loss dB>
#     A closed car body between the music and a listener: the level outside is the cabin
#     level minus the loss, and above the corner frequency it falls 12 dB per octave
#     (a second-order low-pass). A listener in a car hears a radio outside through two
#     bodies.
#
#  HEARING <threshold dB> <reference m>
#     A radio outside is heard while its level at the listener exceeds the threshold.
#     The level just outside the car is taken at the reference distance from its centre
#     and falls 6 dB per doubling of the distance beyond it.
#
#  TRAFFIC <share 0-1> [class ...]
#     Share of traffic cars with the radio on. The classes named never play one; a
#     two-wheeler has no closed body and never does.
#
#  LOUDNESS <LUFS>
#     The loudness every clip is brought to by its gain (tools/radio_gain.py).
#
#  Stations: a STATION record, then its PROGRAMME and clips.
#
#  STATION <folder> <name ...>
#     The clips are in assets/radio/<folder>/; the name is shown when the radio tunes in.
#
#  PROGRAMME <talk share 0-1> <song gap> <talk gap>
#     A clip follows that share of the songs, never two clips in a row. A song comes back
#     only after <song gap> other songs, a clip after <talk gap> other clips; each gap
#     must be smaller than the number of songs or clips.
#
#  SONG <file> <gain dB>     a song
#  DJ   <file> <gain dB>     the DJ talking between songs
#  AD   <file> <gain dB>     a commercial
#     The gain brings the clip to the LOUDNESS target. After adding or changing a clip,
#     run: python tools/radio_gain.py
#
#  Every file named here is required (docs/adr/0010-no-fallback-content.md): a missing
#  clip or a bad record stops loading with a message.
# =====================================================================================

INCAR    0.5
CABIN    80 92 0.25
BODY     300 25
HEARING  40 2
TRAFFIC  0.4 Police Ambulance FireTruck
LOUDNESS -16

# 1980s American rock, made by the project's author with Suno (CREDITS.md)
STATION   asphalt_rock Asphalt Rock FM
PROGRAMME 0.65 5 3
SONG song_01.mp3 +0.2
SONG song_02.mp3 -0.2
SONG song_03.mp3 -0.4
SONG song_04.mp3 -0.7
SONG song_05.mp3 +0.3
SONG song_06.mp3 +1.0
SONG song_07.mp3 -1.1
SONG song_08.mp3 -0.7
DJ   dj_01.mp3   +0.5
DJ   dj_02.mp3   +1.1
DJ   dj_03.mp3   +0.6
AD   ad_01.mp3   +0.5
AD   ad_02.mp3   +0.9
AD   ad_03.mp3   +1.5
