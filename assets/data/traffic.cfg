# Physical traffic recovery; unspecified records use validated built-in defaults.
# Format: RECOVERY <name> <value>. Speeds are px/s, time is s, clearance is px.
# The arcade brake reverses at low speed; the controller holds with the handbrake.
# Prediction checks swept boxes with production forces: 240 Hz at 60 Hz frames,
# 160 Hz at 20 Hz frames; faster frames use a bounded 240 Hz forecast.
RECOVERY forward_speed 75
RECOVERY reverse_speed 60
RECOVERY horizon 2.4
RECOVERY stop_tail 0.5
RECOVERY clearance 1.0
RECOVERY planning_interval 0.25
RECOVERY commitment 0.45
RECOVERY hysteresis 6
RECOVERY stall_time 1.0
RECOVERY nearby_radius 900
RECOVERY planning_steps 600

# Cooperative yielding between two drivers stopped behind each other.
# Format: YIELD <name> <value>. Time is s, speed px/s, distance px.
# The yielding rail car retraces its own driven path; max_chain limits how many
# drivers queued behind it back up together.
YIELD enabled 1
YIELD detect_time 0.5
YIELD clear_time 1.0
YIELD retreat_speed 60
YIELD retreat_accel 120
YIELD retreat_extra 40
YIELD max_chain 3
# Two knocked cars, or three or more drivers waiting on each other in a loop (junction
# gridlock): one gives way to the driver waiting on it. 0 keeps only the pair rule.
YIELD cycles 1
YIELD min_room 6

# Driver incidents after a collision (one per pair of cars).
# Format: INCIDENT <name> <value>. Shares are fractions of new traffic drivers;
# impacts are px/s (closing speed / delta-V), time is s, distance px.
INCIDENT enabled 1
INCIDENT aggressive_share 0.10
INCIDENT calm_share 0.45
INCIDENT min_impact 60
INCIDENT serious_dv 320
INCIDENT confront_chance 0.75
INCIDENT argue_time 3
INCIDENT give_up_distance 480
INCIDENT fight_time 10
INCIDENT exit_wait 3
INCIDENT pair_memory 60
