# =====================================================================================
#  Concrete Jungle - vehicles
#  Edit this file to add / tune vehicles. No code changes needed.
#  Scale: 16 px = 1 m. Sprites must face UP (front of the vehicle at the top).
#
#  CLASS <name> <length m> <height m> <top speed km/h> <accel m/s2> <brake m/s2>
#        <reverse km/h> <steer rad/s> <grip> <mass t> <hp> <traffic weight> [flags]
#     flags: police emergency large two_wheeler
#     (accel/brake are arcade-tuned, not real-world values)
#
#  TURN <class> <turning circle m>
#     Kerb-to-kerb turning circle (outer front wheel, full lock). Traffic sizes its turns
#     through junctions from it. A class without one gets 2.3 times its length.
#
#  WIDTH <class> <width m>
#     Collision width. A class without one takes its sprite's width (length x aspect,
#     mirrors included). The sprite keeps its aspect either way, so mirrors or handlebars
#     drawn wider than the WIDTH overhang the collision box.
#
#  SPRITE <class> <file in assets/vehicles/> <extra paint variants 0-3>
#     Paint variants hue-shift the coloured body panels (glass/tyres untouched).
#
#  BIKE <class> <empty file> <ridden file>
#     A two-wheeler without and with its rider, both in assets/vehicles/. The two images
#     need the same visible size and centre, so the bike stays put when the rider gets on
#     or off. Each BIKE line is one look; add more lines for more colours.
#
#  DERIVE <class> stretch <file> <band start> <band end> <factor> <paint colours...>
#     Stretches a horizontal band of an existing sprite (fractions of its height),
#     e.g. a limousine from a car, a coach from a van. Keeps the original art style.
#
#  COMPOSE <class> <front file> <from> <to> <rear file> <from> <to> <rear stretch> <paint colours...>
#     Front part of one sprite + rear part of another (e.g. truck cab + van body).
#
#  GEN <class> <generator> <colours...>
#     Procedural placeholder art: car_hatch car_sedan car_coupe car_suv car_limo bus
#     boxtruck firetruck garbage bike_sport bike_chopper bike_scooter
#
#  Colours: red blue white black silver green darkgreen beige teal maroon yellow orange
#           cream grey darkgrey navy brown purple pink - or r,g,b ; join several with '/'
# =====================================================================================

